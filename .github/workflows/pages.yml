# 推送到 dev / master 分支后自动构建并部署到 GitHub Pages
# 仓库 Settings -> Pages -> Source 需选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "20.x"

      - name: Install Dependencies
        run: npm install

      # 以 .env.example 为基底写入 .env，若仓库配置了同名 Secrets 则覆盖
      - name: Write .env
        shell: bash
        env:
          VITE_SITE_NAME: ${{ secrets.VITE_SITE_NAME }}
          VITE_SITE_AUTHOR: ${{ secrets.VITE_SITE_AUTHOR }}
          VITE_SITE_KEYWORDS: ${{ secrets.VITE_SITE_KEYWORDS }}
          VITE_SITE_DES: ${{ secrets.VITE_SITE_DES }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SITE_LOGO: ${{ secrets.VITE_SITE_LOGO }}
          VITE_SITE_MAIN_LOGO: ${{ secrets.VITE_SITE_MAIN_LOGO }}
          VITE_SITE_APPLE_LOGO: ${{ secrets.VITE_SITE_APPLE_LOGO }}
          VITE_DESC_HELLO: ${{ secrets.VITE_DESC_HELLO }}
          VITE_DESC_TEXT: ${{ secrets.VITE_DESC_TEXT }}
          VITE_DESC_HELLO_OTHER: ${{ secrets.VITE_DESC_HELLO_OTHER }}
          VITE_DESC_TEXT_OTHER: ${{ secrets.VITE_DESC_TEXT_OTHER }}
          VITE_WEATHER_KEY: ${{ secrets.VITE_WEATHER_KEY }}
          VITE_SITE_START: ${{ secrets.VITE_SITE_START }}
          VITE_SITE_ICP: ${{ secrets.VITE_SITE_ICP }}
          VITE_SONG_API: ${{ secrets.VITE_SONG_API }}
          VITE_SONG_SERVER: ${{ secrets.VITE_SONG_SERVER }}
          VITE_SONG_TYPE: ${{ secrets.VITE_SONG_TYPE }}
          VITE_SONG_ID: ${{ secrets.VITE_SONG_ID }}
        run: |
          cp .env.example .env
          for k in VITE_SITE_NAME VITE_SITE_AUTHOR VITE_SITE_KEYWORDS VITE_SITE_DES \
                   VITE_SITE_URL VITE_SITE_LOGO VITE_SITE_MAIN_LOGO VITE_SITE_APPLE_LOGO \
                   VITE_DESC_HELLO VITE_DESC_TEXT VITE_DESC_HELLO_OTHER VITE_DESC_TEXT_OTHER \
                   VITE_WEATHER_KEY VITE_SITE_START VITE_SITE_ICP \
                   VITE_SONG_API VITE_SONG_SERVER VITE_SONG_TYPE VITE_SONG_ID; do
            v="${!k}"
            if [ -n "$v" ]; then
              if grep -q "^$k=" .env; then
                sed -i "s|^$k=.*|$k=\"$v\"|" .env
              else
                printf '%s="%s"\n' "$k" "$v" >> .env
              fi
            fi
          done

      - name: Build Website
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
